<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>No Contact</title>
  <style>
    :root { --bg: #f4f1ec; --text: #22201c; --muted: #6f6a62; --accent: #3d6b5a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161514; --text: #ece8e1; --muted: #a39d93; --accent: #7fb39f; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 72px 16px; text-align: center; }
    h1 { font-size: 30px; margin: 0 0 12px; }
    p { color: var(--muted); }
    #status { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">No Contact</h1>
    <p id="status"></p>
    <p id="body"></p>
  </main>
  <script>
    // Two modes, both set by the extension in the #hash (never sent to this host):
    //  #mode=connect&e=...  one-time setup, so the friend can activate alerts from this page
    //  #e=...               opened by Chrome when the extension is uninstalled
    (async () => {
      const p = new URLSearchParams(location.hash.slice(1));
      const to = p.get('e');
      const name = p.get('n') || 'Your friend';
      const friend = p.get('f');
      const connect = p.get('mode') === 'connect';
      const $ = (id) => document.getElementById(id);
      if (!to) return;
      history.replaceState(null, '', location.pathname);

      if (connect) {
        $('title').textContent = 'Tamper alert set up';
        $('body').textContent = 'You can close this tab.';
      } else {
        $('title').textContent = 'No Contact was removed.';
        $('status').textContent = 'Letting your friend know…';
        $('body').textContent = "That's okay. If it was a hard moment, talking to them will help more than whatever you were about to look at.";
      }

      const hi = friend ? `Hi ${friend},` : 'Hi,';
      const message = connect
        ? `${hi}\n\nThis connects the tamper alert for ${name}'s No Contact blocker. If they ever uninstall it while it's locked, you'll get an email from here.`
        : `${hi}\n\n${name} just uninstalled the No Contact blocker while it was locked.\n\nIt might be nothing, or it might be a rough moment. A message or call would be good.`;
      try {
        const r = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(to)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            _subject: connect ? `${name}'s No Contact tamper alert` : `${name} removed the No Contact blocker`,
            _template: 'box',
            _captcha: 'false',
            from: 'No Contact',
            message,
          }),
        });
        const j = await r.json().catch(() => ({}));
        if (!connect) $('status').textContent = String(j.success) === 'true' ? `${friend || 'Your friend'} has been told.` : '';
      } catch (_) {
        if (!connect) $('status').textContent = '';
      }
    })();
  </script>
</body>
</html>
